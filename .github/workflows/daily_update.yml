name: 存股資產自動同步 (每5分鐘)

on:
  schedule:
    # 每個平日台股交易時段 (台灣時間 09:00 ~ 13:40，UTC 01:00 ~ 05:40) 每 5 分鐘自動同步一次
    - cron: '*/5 1-5 * * 1-5'
    # 收盤後下午 14:00 與 16:00 執行最終結算入庫
    - cron: '0 6,8 * * 1-5'
    # 若您希望 24 小時不分晝夜每 5 分鐘都跑一次，可將上方註解並改為：
    # - cron: '*/5 * * * *'
  workflow_dispatch: # 隨時可在 GitHub 網頁上手動點擊「Run workflow」立即執行同步
  push:
    branches:
      - main

jobs:
  sync-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 檢出儲存庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install -r requirements.txt

      - name: 抓取 Google 試算表與股市行情並更新
        run: |
          python update_portfolio.py

      - name: 自動提交並推送更新至 GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add portfolio.xlsx portfolio_data.json index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto sync portfolio: $(date +'%Y-%m-%d %H:%M:%S UTC')" && git push)
